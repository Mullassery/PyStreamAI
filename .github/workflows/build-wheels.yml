name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install maturin twine

      - name: Build wheel
        run: maturin build --release
        # NOTE: maturin writes wheels to target/wheels/, not dist/ - the
        # `twine upload dist/*` this workflow used to run would silently
        # match zero files. Fixed to point at the real output directory.

      - name: Upload to PyPI
        # NOTE (restoration audit, 2026-08): this uses a long-lived PYPI_TOKEN
        # repo secret via `twine -p`. PyPI Trusted Publishing (OIDC, via
        # pypa/gh-action-pypi-publish) is the more secure modern approach -
        # no long-lived token stored in GitHub at all - but it requires
        # registering this repo's GitHub Actions OIDC publisher on the
        # PyPI project settings page (pypi.org/manage/project/pystreamai/settings/publishing/),
        # which is outside what this repo's files can configure. Recommended
        # follow-up: register trusted publishing on PyPI, then switch this
        # step to pypa/gh-action-pypi-publish@release/v1 with no token.
        run: twine upload target/wheels/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
