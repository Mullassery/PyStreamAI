name: Security Audit

# Runs on a schedule + manual dispatch rather than on every push/PR, so a
# newly-discovered advisory in a transitive dependency doesn't block
# unrelated PRs from merging. Findings should be triaged as issues, not
# silently ignored - this job intentionally does NOT swallow failures with
# `|| true`; a red run here means a real advisory was found and should be
# looked at.
#
# NOTE: not runnable/verifiable in the sandbox this workflow was authored
# in (no network access to pypi.org/crates.io/GitHub's advisory DB). It has
# not been confirmed green on actual GitHub Actions infrastructure yet.
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serving,onnx,observability,registry]"
          pip install pip-audit
      - name: pip-audit
        run: pip-audit

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
