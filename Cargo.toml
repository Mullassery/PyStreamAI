[package]
name = "pystreamai"
version = "0.3.0"
edition = "2021"
description = "Rust orchestrator for PyStreamAI - simple ML deployment platform"
license = "Proprietary"

[lib]
name = "pystreamai"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
dashmap = "5.5"
prometheus = "0.13"
lazy_static = "1.4"
parking_lot = "0.12"
fxhash = "0.2"

[dev-dependencies]
