[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pystreamai"
version = "2.1.0"
description = "ML deployment toolkit: canary/A-B deployment routing, cost tracking, request scheduling, hot model reload, and ONNX Runtime inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
keywords = ["ml", "deployment", "orchestration", "kubeflow", "kserve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
# pystreamai.api / pystreamai.serving import fastapi/uvicorn unconditionally.
serving = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
# pystreamai.onnx_runtime imports onnxruntime/numpy unconditionally; `onnx`
# is only needed by the test suite (tests/test_onnx_runtime.py,
# tests/test_platform_onnx_predict.py) to build .onnx graphs to load.
# Verified 2026-09-21: onnxruntime 1.30.0 (the version `>=1.15.0` resolves
# to today) only loads models up to IR version 13 (confirmed directly:
# a hand-built IR-14 graph is the first one it rejects). onnx's own
# default IR version by release: 1.15.0-1.19.x -> 9-12, 1.20.0-1.22.0 ->
# 13, 1.23.0 (current latest) -> 14. Pinning below 1.23.0 keeps the
# `[onnx]` extra's own test suite actually passing; lifting this pin
# needs either an onnxruntime bump past 1.30.0 (potential breaking API
# changes - out of scope for this pin) or a future onnx release that
# reverts to IR <=13.
onnx = [
    "onnxruntime>=1.15.0",
    "onnx>=1.15.0,<1.23.0",
    "numpy>=1.24.0",
]
# pystreamai.observability can export to Prometheus if installed.
observability = [
    "prometheus-client>=0.19.0",
]
# pystreamai.model_registry can integrate with MLflow/HF Hub if installed.
registry = [
    "mlflow>=2.8.0",
    "huggingface_hub>=0.19.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    # tests/test_api.py and tests/test_model_failure_states.py both need
    # `httpx` for fastapi.testclient.TestClient (`pytest.importorskip`
    # guards them). Without it, those two whole files (15 tests) are
    # silently skipped - found and fixed in this pass, same shape of bug
    # as the ONNX extra gap (see the `onnx` extra above).
    "httpx>=0.24.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/mullassery/pystreamai/issues"
"Homepage" = "https://github.com/mullassery/pystreamai"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pystreamai._core"
# Without this, `maturin sdist` omits LICENSE from the sdist tarball and
# PyPI rejects the upload (400) when the sdist is checked against the
# declared license. Recurring bug across this org's maturin-based repos.
include = ["LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Pin to pyflakes + core pycodestyle errors rather than ruff's shifting
# "all rules" default - keeps CI failures meaningful (real bugs: unused
# imports/names, undefined names, syntax issues) instead of churning on
# style preferences (e.g. typing.Dict vs dict) across ~4.6k lines of
# restored code that predates this rule set.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
